# NeoBot 示例配置文件 — 用于 CI / 本地开发
# 所有凭据均为占位值，不会连接真实服务

[napcat_ws]
uri = "ws://localhost:8080"
token = ""
reconnect_interval = 5

[bot]
command = ["/"]
ignore_self_message = true
permission_denied_message = "权限不足，需要 {permission_name} 权限"
# 别的机器人的指令。看到这些名字保持沉默，不要回复「你是不是想用 …」
unknown_command_ignore = ["今日猪猪", "我的猪圈"]
# 同一群两次未知指令提示的最小间隔（秒）
unknown_command_hint_interval = 60

[redis]
host = "localhost"
port = 6379
db = 0
password = ""
signing_secret = ""  # pubsub 消息 HMAC 签名密钥（多机器人共享，留空则回退用 Redis 密码）

[mysql]
host = "localhost"
port = 3306
user = "root"
password = ""
db = "neobot"

[docker]
base_url = ""
sandbox_image = "python-sandbox:latest"
timeout = 10
concurrency_limit = 5

[code_py]
# /py 沙箱。默认关闭：生产容器没有 docker.sock，也没有 python-sandbox 镜像。
# 只有准备好镜像并且明确要开放时才改成 true。不要为了这个去挂载 docker.sock。
enabled = false

[birthday]
# 每天这个钟点（Asia/Shanghai）给本群过生日的人一句祝福。只存月-日。
hour = 9
# 如果 9 点那会儿机器人不在，这几个小时内补上
window_hours = 3
# /生日列表 看未来多少天
lookahead_days = 30

[chatty]
# /今日话痨 /本周话痨。只记条数，不记内容。retain_days 至少 7，方便算一周。
top_n = 10
retain_days = 8

[reminder]
# /提醒 的上限。时间用 Asia/Shanghai。
max_per_user = 8
max_per_group = 40
# 循环提醒的最短间隔（分钟）。每天一次不受这个限制卡住。
min_interval_minutes = 30

[link_cache]
# 解析结果缓存（秒）。Redis 可用时放 Redis，否则用内存 LRU。
ttl_seconds = 600
# 同一群同一链接在这段时间内不重复解析、不重复发送
dedupe_seconds = 180
# 内存缓存条数上限
max_items = 256

[image_manager]
image_height = 1920
image_width = 1080

[reverse_ws]
enabled = false
host = "0.0.0.0"
port = 3002
token = ""

[threading]
max_workers = 10
client_max_workers = 5

[bilibili]
sessdata = ""
bili_jct = ""
buvid3 = ""

[douyin]
# douyin2api 服务密钥（https://dy-api.d1ck.top，需向服务方申请），留空则跳过该解析通道
api_key = ""
# 远梦API（https://api.qzqi.com）DouYinVideo 接口密钥，留空则跳过该解析通道（也支持环境变量 DOUYIN_QZQI_APIKEY）
qzqi_api_key = ""

[jinman]
# 禁漫天堂（JMComic）PDF 解析：自建 JMComic-Api 服务地址（https://github.com/FfmpegZZZ/JMComic-Api）
api_base = "http://127.0.0.1:8699"
# PDF 生成超时（秒），首本生成需下载全部图片
timeout = 600

# =============================================================================
# 水鱼查分器（diving-fish）OAuth 配置（可选，maimaiDX B50 等查分功能）
# 申请入口：https://auth.diving-fish.com/console（登记应用后生成 client_secret）
# =============================================================================
[divingfish]
client_id = ""            # 水鱼开发者控制台应用 ID
client_secret = ""        # 机密客户端凭据，仅存服务端，勿提交
auth_base = "https://auth.diving-fish.com"                              # 授权服务器
api_base = "https://www.diving-fish.com/api/maimaidxprober"             # 查分器 API

[ehentai]
# E-Hentai / ExHentai 画廊解析：自建 RESTful-ehentai-api 服务地址（https://github.com/bandcomic/RESTful-ehentai-api）
api_base = "http://127.0.0.1:8677"
# 画廊详情请求超时（秒）
timeout = 30
# 可选：E-Hentai/ExHentai Cookie（访问 ExHentai 全部内容需要，留空则以游客身份访问公开 E-Hentai）
cookie = ""

[local_file_server]
# 生产若要中转视频/图片给 NapCat，设为 true。CI / 无 NapCat 的环境保持 false。
enabled = false
# 必须是 0.0.0.0。NeoBot 走 host 网络，NapCat 在独立容器 wb-napcat 里，
# 只监听 127.0.0.1 时容器访问不到这个端口。
host = "0.0.0.0"
port = 3003
# NapCat 拉取文件用的根地址。留空时：能看到 docker0 就用它（常见是 http://172.17.0.1:3003），
# 否则用 http://127.0.0.1:3003（仅当 NapCat 与本进程在同一网络命名空间）。
# 不要填 http://127.0.0.1:3003 —— 那是 NapCat 容器自己的回环，会拉不到文件。
# 自定义网络时写成容器能访问的地址，例如 http://192.168.1.100:3003
# 下载接口不校验额外 token：NapCat 只会 GET 这个 URL，带了鉴权头反而会 403。
base_url = ""

[discord]
enabled = false
token = ""

[cross_platform]
enabled = false

[daily]
# /今日运势 的盐。换掉会使同一天的结果改变。不是密钥，可以留空。
salt = ""
# /今天吃什么 的菜单。留空（foods = []）则使用插件内置的一份。
foods = ["番茄炒蛋", "味噌拉面", "葱油拌面", "小笼包"]

[daily_cp]
# /今日CP 的盐。换掉会使同一天的配对改变。不是密钥，可以留空。
salt = ""

[daily_news]
# 每天早上把国际快讯和时事新闻送到 groups 里的群。默认关闭。
# 真实群号只写在服务器的 config.toml，不要写进仓库、示例或测试。
# 未列入的群发送 /早报 时保持沉默。今日猪猪、我的猪圈仍是别的机器人的指令，继续忽略。
enabled = false
groups = []
time = "08:00"
timezone = "Asia/Shanghai"
max_items_international = 8
max_items_domestic = 6
request_timeout = 12
# 合并转发失败时改发一条普通文字
send_as_forward = true
# 同一个群手动 /早报 的最短间隔（秒）
manual_cooldown_seconds = 600
# 删掉下面的 [[daily_news.sources]]，或写成 sources = []，就用插件内置的同一批地址。
# 2026-11-12 核对过：下面三条中新网 RSS 能解析，而且是当天的条目。
# 人民网 https://www.people.com.cn/rss/world.xml 和 politics.xml 能打开，但条目停在 2025-06。
# 新华网 https://www.news.cn/world/news_world.xml 和 politics 能打开，但条目停在 2022，且没有日期。
# 这两家不放进默认列表，避免把旧闻当成早报。需要的话再填仍在更新的地址。

[[daily_news.sources]]
name = "中新网国际"
url = "https://www.chinanews.com.cn/rss/world.xml"
category = "international"

[[daily_news.sources]]
name = "中新网国内"
url = "https://www.chinanews.com.cn/rss/china.xml"
category = "domestic"

[[daily_news.sources]]
name = "中新网社会"
url = "https://www.chinanews.com.cn/rss/society.xml"
category = "domestic"

[dice]
# 同一群两次掷骰的最小间隔（秒）
cooldown_seconds = 3
max_dice = 100
max_faces = 1000

[poke]
# 同一群两次戳一戳回复的最小间隔（秒）
cooldown_seconds = 20
# true 时会回戳对方。默认只回一句文字。
poke_back = false

[poll]
# 每个群同时进行中的投票上限
max_concurrent = 3
# 未结束的投票多少小时后自动过期
ttl_hours = 24
max_options = 8

[caption]
# /加字 允许的最大字数
max_chars = 36

[saucenao]
# 留空则 /搜源 会说明尚未配置，并在 ascii2d_fallback 开启时尝试备用。
api_key = ""
min_similarity = 55
num_results = 6
ascii2d_fallback = true
timeout = 15

[e926]
# e926.net 是 SFW 站点。账号可留空，以访客身份请求。
user_agent = "NeoBot/1.0 (QQ furry group bot; contact: local-operator)"
username = ""
api_key = ""
rate_limit_seconds = 8
max_count = 3
# 这些标签会被拒绝，也会作为负标签发给 e926
blacklist = ["cub", "young", "child", "loli", "shota", "toddler", "baby", "diaper", "gore", "scat", "watersports", "urine"]

[music]
# 自建点歌服务。留空则使用 public_base。
# 旧的本地 Netease_url（POST /search 与 POST /song）请把 base_url 指过去，并把 api_style 改成 "netease_url"。
base_url = ""
# 公开的网易云 API 兼容接口，不保证长期可用。挂了就换成你自己的。
public_base = "https://netease-cloud-music-api-psi-azure.vercel.app"
# ncm：/search、/song/url、/song/detail
# netease_url：旧本地 POST 协议
api_style = "ncm"
# ncm 拿不到直链时使用。{id} 会替换成歌曲 ID。留空 "" 则不兜底。
play_url_template = "https://api.injahow.cn/meting/?server=netease&type=url&id={id}"
# 识别网易云 / 酷狗 / YouTube 链接时回复一张文字信息卡
link_card = true
timeout = 12

[logging]
# 长期运行时建议用 INFO：DEBUG 会把每条消息、每个事件都写进文件，磁盘增长很快
level = "DEBUG"
file_level = "DEBUG"
console_level = "INFO"
# 日志文件保留天数，超过后由 loguru 自动删除
retention_days = 7

[mcc_adapter]
# 8800 上的 mcc-service 已下线。保持 false：适配器不会启动，也不会去探测该端口。
# 若生产 config.toml 里写成了 true，请改回 false，否则日志会持续出现「MCC 服务不可达」。
enabled = false
service_url = "http://127.0.0.1:8800"
service_token = "replace-me"
timeout_ms = 10000
listener_ignore_senders = []          # 游戏内监听忽略的桥接机器人昵称
