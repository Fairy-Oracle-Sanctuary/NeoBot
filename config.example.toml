# NeoBot 示例配置文件 — 用于 CI / 本地开发
# 所有凭据均为占位值，不会连接真实服务

[napcat_ws]
uri = "ws://localhost:8080"
token = ""
reconnect_interval = 5

[bot]
command = ["/"]
ignore_self_message = true
permission_denied_message = "权限不足，需要 {permission_name} 权限"

[redis]
host = "localhost"
port = 6379
db = 0
password = ""
signing_secret = ""  # pubsub 消息 HMAC 签名密钥（多机器人共享，留空则回退用 Redis 密码）

[mysql]
host = "localhost"
port = 3306
user = "root"
password = ""
db = "neobot"

[docker]
base_url = ""
sandbox_image = "python-sandbox:latest"
timeout = 10
concurrency_limit = 5

[image_manager]
image_height = 1920
image_width = 1080

[reverse_ws]
enabled = false
host = "0.0.0.0"
port = 3002
token = ""

[threading]
max_workers = 10
client_max_workers = 5

[bilibili]
sessdata = ""
bili_jct = ""
buvid3 = ""

[douyin]
# douyin2api 服务密钥（https://dy-api.d1ck.top，需向服务方申请），留空则跳过该解析通道
api_key = ""
# 远梦API（https://api.qzqi.com）DouYinVideo 接口密钥，留空则跳过该解析通道（也支持环境变量 DOUYIN_QZQI_APIKEY）
qzqi_api_key = ""

[jinman]
# 禁漫天堂（JMComic）PDF 解析：自建 JMComic-Api 服务地址（https://github.com/FfmpegZZZ/JMComic-Api）
api_base = "http://127.0.0.1:8699"
# PDF 生成超时（秒），首本生成需下载全部图片
timeout = 600

# =============================================================================
# 水鱼查分器（diving-fish）OAuth 配置（可选，maimaiDX B50 等查分功能）
# 申请入口：https://auth.diving-fish.com/console（登记应用后生成 client_secret）
# =============================================================================
[divingfish]
client_id = ""            # 水鱼开发者控制台应用 ID
client_secret = ""        # 机密客户端凭据，仅存服务端，勿提交
auth_base = "https://auth.diving-fish.com"                              # 授权服务器
api_base = "https://www.diving-fish.com/api/maimaidxprober"             # 查分器 API

[ehentai]
# E-Hentai / ExHentai 画廊解析：自建 RESTful-ehentai-api 服务地址（https://github.com/bandcomic/RESTful-ehentai-api）
api_base = "http://127.0.0.1:8677"
# 画廊详情请求超时（秒）
timeout = 30
# 可选：E-Hentai/ExHentai Cookie（访问 ExHentai 全部内容需要，留空则以游客身份访问公开 E-Hentai）
cookie = ""

[local_file_server]
enabled = false
host = "0.0.0.0"
port = 3003
# NapCat 访问本文件服务器的地址（用于合并转发等场景的视频/图片下载）
# 留空 = http://127.0.0.1:3003，适用于 NapCat 与 NeoBot 同机且 NapCat 为 host 网络；
# 若 NapCat 是独立容器，填宿主机可达地址，如 http://192.168.1.100:3003
base_url = ""

[discord]
enabled = false
token = ""

[cross_platform]
enabled = false

[logging]
level = "DEBUG"
file_level = "DEBUG"
console_level = "INFO"

[mcc_adapter]
enabled = false
service_url = "http://127.0.0.1:8800"
service_token = "replace-me"
timeout_ms = 10000
listener_ignore_senders = []          # 游戏内监听忽略的桥接机器人昵称
