name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 全量历史:push 路径 diff HEAD~1、PR 路径 merge-base 都需要父提交
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint (changed files only)
        run: |
          pip install ruff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 只用环境变量取 base_ref(不用表达式,防注入),并做白名单校验
            BASE="${GITHUB_BASE_REF:-main}"
            case "$BASE" in
              *[!A-Za-z0-9_./-]*) echo "非法 base_ref: $BASE" >&2; exit 1 ;;
            esac
            if git rev-parse --verify "origin/$BASE" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "origin/$BASE"...HEAD -- '*.py' | tr '\n' ' ')
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.py' | tr '\n' ' ')
            fi
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.py' | tr '\n' ' ')
          fi
          if [ -n "$CHANGED" ]; then
            ruff check -- $CHANGED
          else
            echo "No Python files changed, skip lint"
          fi

      - name: Run tests
        run: python -m pytest --tb=short -q

  build:
    runs-on: ubuntu-latest
    needs: [test]
    environment:
      name: package
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
