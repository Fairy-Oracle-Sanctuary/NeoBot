<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>功能列表</title>
    <style>
        {% include "theme.css" %}
    </style>
</head>
<body>
    <div class="nb-page">
        <div>
            <h1 class="nb-title">功能列表</h1>
            <p class="nb-subtitle">已加载 {{ plugins|length }} 个模块</p>
        </div>
        {% for plugin in plugins %}
        <section class="nb-card">
            <h2 class="nb-card-title">{{ plugin.name }}</h2>
            <p class="nb-body">{{ plugin.description }}</p>
            <pre class="nb-cmd">{{ plugin.usage }}</pre>
        </section>
        {% endfor %}
        <p class="nb-footnote">发送 /help 可以再打开这份列表</p>
    </div>
</body>
</html>
