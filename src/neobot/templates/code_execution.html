<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代码执行结果</title>
    <style>
        {% include "theme.css" %}
        .who { display: flex; gap: 14px; align-items: center; }
        .result-error .nb-card-title,
        .result-error .nb-pre { color: #b42318; }
    </style>
</head>
<body>
    <div class="nb-page">
        <div>
            <h1 class="nb-title">代码执行结果</h1>
            <p class="nb-subtitle">{{ timestamp }}</p>
        </div>
        <div class="who">
            <div class="nb-avatar" style="display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;">
                {% if qq_avatar_url %}
                <img src="{{ qq_avatar_url }}" alt="" class="nb-avatar" onerror="this.replaceWith(document.createTextNode('{{ avatar_initial }}'))">
                {% else %}
                {{ avatar_initial }}
                {% endif %}
            </div>
            <div>
                <p class="nb-body" style="font-weight:700;">{{ user_nickname }}</p>
                <p class="nb-subtitle">{{ execution_time }}</p>
            </div>
        </div>
        <section class="nb-card">
            <h2 class="nb-card-title">代码</h2>
            <pre class="nb-cmd">{{ code }}</pre>
        </section>
        <section class="nb-card {{ result_class }}">
            <h2 class="nb-card-title">{{ result_title }}</h2>
            <pre class="nb-pre">{{ result }}</pre>
        </section>
        <p class="nb-footnote">Python {{ python_version }} · 在沙箱里执行</p>
    </div>
</body>
</html>
