<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GitHub 仓库</title>
    <style>
        {% include "theme.css" %}
        .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    </style>
</head>
<body>
    <div class="nb-page">
        <div class="head">
            <div>
                <h1 class="nb-title">{{ full_name }}</h1>
                <p class="nb-subtitle">{{ description }}</p>
            </div>
            {% if owner_avatar %}
            <img src="{{ owner_avatar }}" alt="" class="nb-avatar">
            {% endif %}
        </div>
        <section class="nb-card">
            <h2 class="nb-card-title">仓库数据</h2>
            <table class="nb-table">
                <tr><th>星标</th><td class="num">{{ stargazers_count }}</td></tr>
                <tr><th>派生</th><td class="num">{{ forks_count }}</td></tr>
                <tr><th>未关闭议题</th><td class="num">{{ open_issues_count }}</td></tr>
                <tr><th>关注</th><td class="num">{{ watchers_count }}</td></tr>
            </table>
        </section>
        <p class="nb-footnote">数据来自 GitHub</p>
    </div>
</body>
</html>
